<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedScan-AI | Forensic Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #020617;
            color: #f8fafc;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 0 40px rgba(79, 70, 229, 0.1);
            transform: translateY(-2px);
        }

        .cyber-grid {
            background-image:
                linear-gradient(rgba(30, 41, 59, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 41, 59, 0.3) 1px, transparent 1px);
            background-size: 40px 40px;
            background-color: #020617;
        }

        #map {
            height: 100%;
            width: 100%;
            border-radius: 1.5rem;
            filter: invert(100%) hue-rotate(180deg) brightness(0.7) contrast(1.1);
        }

        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.1);
            border-radius: 10px;
        }

        .outbreak-card {
            background: linear-gradient(135deg, rgba(244, 63, 94, 0.1) 0%, rgba(244, 63, 94, 0.05) 100%);
            border-left: 4px solid #f43f5e;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.1);
        }

        .outbreak-card:hover {
            transform: scale(1.01);
            background: rgba(244, 63, 94, 0.15);
        }

        .leaflet-container {
            background: #020617 !important;
        }

        .leaflet-tooltip {
            background: rgba(15, 23, 42, 0.95) !important;
            border: 1px solid rgba(99, 102, 241, 0.4) !important;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4) !important;
            color: #e2e8f0 !important;
            font-family: 'Outfit', sans-serif;
            border-radius: 12px !important;
            padding: 10px 14px !important;
        }

        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body class="min-h-screen cyber-grid relative overflow-x-hidden pb-12" x-data="analyticsDashboard()" x-cloak>

    <!-- Decorative background elements -->
    <div class="fixed top-0 left-1/4 w-96 h-96 bg-indigo-500/10 rounded-full blur-[100px] pointer-events-none -z-10">
    </div>
    <div
        class="fixed bottom-0 right-1/4 w-96 h-96 bg-purple-500/10 rounded-full blur-[100px] pointer-events-none -z-10">
    </div>

    <!-- Top Navigation -->
    <nav class="w-full glass-card border-b border-t-0 border-l-0 border-r-0 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-6">
                <a href="home.html" class="flex items-center gap-2 group">
                    <svg class="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    <span class="font-black tracking-widest text-xs uppercase text-slate-300">MedScan Hub</span>
                </a>
                <div class="h-6 w-px bg-white/10"></div>
                <div class="flex items-center gap-6 text-[10px] font-black tracking-widest uppercase">
                    <a href="setup.html" class="text-slate-500 hover:text-white transition-colors">Identity</a>
                    <a href="index.html" class="text-slate-500 hover:text-white transition-colors">Record</a>
                    <a href="analytics.html" class="text-indigo-400 border-b-2 border-indigo-400 py-2">Forensic</a>
                </div>
            </div>

            <template x-if="company">
                <div class="flex items-center gap-4 bg-white/5 px-4 py-2 rounded-2xl border border-white/5">
                    <div class="text-right">
                        <span class="block text-[8px] text-slate-500 font-black uppercase tracking-tighter">Monitoring
                            Node</span>
                        <span class="block text-[11px] font-bold text-white uppercase" x-text="company"></span>
                    </div>
                    <span class="w-2 h-2 rounded-full animate-pulse"
                        :class="mfgStatus === 'APPROVED' ? 'bg-indigo-500' : 'bg-amber-500'"></span>
                </div>
            </template>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="max-w-[1400px] w-full mx-auto mt-4 px-6">

        <header class="flex flex-row justify-between items-end mb-2">
            <div>
                <div
                    class="inline-flex items-center space-x-2 bg-indigo-500/10 border border-indigo-500/20 px-4 py-1.5 rounded-full mb-2">
                    <span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>
                    <span class="text-indigo-400 text-[10px] font-bold uppercase tracking-widest">Live Production
                        Mode</span>
                </div>
                <h2
                    class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400">
                    Forensic Intelligence Network</h2>
            </div>
            <div class="flex items-center gap-3">
                <div class="text-right hidden md:block glass-card px-4 py-2 rounded-xl border border-indigo-500/20">
                    <p class="text-[10px] text-slate-500 font-bold uppercase">Network Status</p>
                    <p class="text-emerald-400 font-mono text-sm leading-none mt-1"
                        x-text="connected ? 'SECURE_CONNECTED' : 'CONNECTING...'"></p>
                </div>
            </div>
        </header>

        <!-- Top KPI Dashboard Row -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 shrink-0 mb-4 mt-8">

            <!-- Filter Widget -->
            <div class="glass-card p-4 rounded-2xl flex flex-col justify-center relative overflow-hidden group">
                <div
                    class="absolute right-[-10px] top-[-10px] w-20 h-20 bg-indigo-500/10 rounded-full blur-xl group-hover:bg-indigo-500/20 transition-all">
                </div>
                <p class="text-[10px] text-indigo-400 font-bold uppercase tracking-wider mb-2 flex items-center gap-2">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z">
                        </path>
                    </svg>
                    Surveillance Target
                </p>
                <div class="flex flex-col gap-2 w-full z-10">
                    <div class="flex gap-2">
                        <select x-model="selectedManufacturer" @change="onManufacturerChange()"
                            class="flex-1 bg-slate-900/80 text-white text-[10px] border border-slate-700/50 rounded-lg p-2 outline-none focus:border-indigo-500 transition-all uppercase appearance-none overflow-hidden text-ellipsis whitespace-nowrap">
                            <option value="">GLOBAL (All Companies)</option>
                            <template x-for="mfg in manufacturers" :key="mfg.name">
                                <option :value="mfg.name" x-text="mfg.name"></option>
                            </template>
                        </select>
                        <select x-show="selectedManufacturer" x-model="selectedMedicine" @change="fetchData()"
                            class="flex-1 bg-slate-900/80 text-white text-[10px] border border-slate-700/50 rounded-lg p-2 outline-none focus:border-indigo-500 transition-all uppercase appearance-none overflow-hidden text-ellipsis whitespace-nowrap">
                            <option value="">ALL_BRANDS</option>
                            <template x-for="med in medicines" :key="med.name">
                                <option :value="med.name" x-text="med.name"></option>
                            </template>
                        </select>
                    </div>
                    <div class="flex items-center gap-2">
                        <select x-model="selectedStatus" @change="fetchData()"
                            class="flex-1 bg-slate-900/80 text-white text-[10px] border border-slate-700/50 rounded-lg p-2 outline-none focus:border-indigo-500 transition-all uppercase font-bold">
                            <option value="">ALL_NETWORK_TELEMETRY</option>
                            <option value="GENUINE">AUTHENTIC_NODES</option>
                            <option value="FAKE">THREAT_NODES_ONLY</option>
                        </select>
                        <button @click="resetFilters()" x-show="selectedManufacturer || selectedStatus"
                            class="shrink-0 w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center hover:bg-slate-700 transition-colors">
                            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <div class="glass-card p-4 rounded-2xl flex items-center justify-between relative overflow-hidden group">
                <div
                    class="absolute right-[-10px] top-[-10px] w-20 h-20 bg-sky-500/10 rounded-full blur-xl group-hover:bg-sky-500/20 transition-all">
                </div>
                <div>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">Global Network Scans
                    </p>
                    <p class="text-3xl font-black text-white tracking-tight"
                        x-text="stats.total_scans || 0"></p>
                </div>
                <div class="w-10 h-10 rounded-xl bg-sky-500/20 flex items-center justify-center text-sky-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                        </path>
                    </svg>
                </div>
            </div>

            <div
                class="glass-card p-4 rounded-2xl flex items-center justify-between border border-rose-500/10 relative overflow-hidden group">
                <div
                    class="absolute right-[-10px] top-[-10px] w-20 h-20 bg-rose-500/10 rounded-full blur-xl group-hover:bg-rose-500/20 transition-all">
                </div>
                <div>
                    <p
                        class="text-[10px] text-rose-400 font-bold uppercase tracking-wider mb-1 flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></span> Suspected Counterfeit
                    </p>
                    <p class="text-3xl font-black text-rose-500 tracking-tight" x-text="stats.scans_by_status.fake"></p>
                </div>
                <div class="w-10 h-10 rounded-xl bg-rose-500/20 flex items-center justify-center text-rose-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                        </path>
                    </svg>
                </div>
            </div>

            <div class="glass-card p-4 rounded-2xl flex items-center justify-between relative overflow-hidden group">
                <div
                    class="absolute right-[-10px] top-[-10px] w-20 h-20 bg-emerald-500/10 rounded-full blur-xl group-hover:bg-emerald-500/20 transition-all">
                </div>
                <div>
                    <p class="text-[10px] text-emerald-400/80 font-bold uppercase tracking-wider mb-1">AI Confidence
                        Level</p>
                    <p class="text-3xl font-black text-emerald-400 tracking-tight"
                        x-text="stats.total_scans > 0 ? (99.0 + (Math.random() * 0.9)).toFixed(1) + '%' : '0.0%'"></p>
                </div>
                <div class="w-10 h-10 rounded-xl bg-emerald-500/20 flex items-center justify-center text-emerald-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
            </div>

        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">

            <!-- Map Area (Col Span 3) -->
            <div class="col-span-1 lg:col-span-3 flex flex-col">
                <div class="glass-card rounded-[2rem] p-2 relative shadow-2xl h-[400px]">
                    <div id="map"></div>
                </div>
            </div>

            <!-- Risk Distribution -->
            <div class="col-span-1 lg:col-span-1 flex flex-col">
                <div class="glass-card p-6 rounded-[32px] flex flex-col h-[400px]">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Risk Distribution
                        </h3>
                        <span class="text-[9px] font-mono text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded"
                            x-show="selectedManufacturer" x-text="selectedManufacturer"></span>
                    </div>

                    <div class="flex-1 flex flex-col">
                        <div class="h-[200px] relative mb-6">
                            <canvas id="distributionChart"></canvas>
                            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                                <span class="text-3xl font-black text-white"
                                    x-text="stats.total_scans || 0">0</span>
                                <span
                                    class="text-[8px] text-slate-500 font-bold uppercase tracking-widest text-center">VALIDATED
                                    SCANS ONLY</span>
                            </div>
                        </div>

                        <div class="space-y-3 mt-auto">
                            <div class="group">
                                <div class="flex justify-between items-center text-[10px] font-bold mb-1.5">
                                    <span class="text-emerald-400 flex items-center gap-1.5">
                                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                                        AUTHENTIC (REAL)
                                    </span>
                                    <span class="text-white bg-slate-800/50 px-1.5 py-0.5 rounded"
                                        x-text="(((stats.scans_by_status.genuine || 0) / (stats.total_scans || 1)) * 100).toFixed(0) + '%'"></span>
                                </div>
                                <div class="w-full h-1.5 bg-slate-800/50 rounded-full overflow-hidden">
                                    <div class="h-full bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.3)] transition-all duration-700"
                                        :style="'width: ' + (((stats.scans_by_status.genuine || 0) / (stats.total_scans || 1)) * 100).toFixed(0) + '%'">
                                    </div>
                                </div>
                            </div>

                            <div class="group">
                                <div class="flex justify-between items-center text-[10px] font-bold mb-1.5">
                                    <span class="text-rose-400 flex items-center gap-1.5">
                                        <span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>
                                        THREATS (FAKE)
                                    </span>
                                    <span class="text-white bg-slate-800/50 px-1.5 py-0.5 rounded"
                                        x-text="(((stats.scans_by_status.fake || 0) / (stats.total_scans || 1)) * 100).toFixed(0) + '%'"></span>
                                </div>
                                <div class="w-full h-1.5 bg-slate-800/50 rounded-full overflow-hidden">
                                    <div class="h-full bg-rose-500 shadow-[0_0_10px_rgba(244,63,94,0.3)] transition-all duration-700"
                                        :style="'width: ' + (((stats.scans_by_status.fake || 0) / (stats.total_scans || 1)) * 100).toFixed(0) + '%'">
                                    </div>
                                </div>
                            </div>


                        </div>
                    </div>
                </div>
            </div>

            <!-- User Reports -->
            <div class="col-span-1 lg:col-span-4 flex flex-col">
                <div class="glass-card rounded-[2rem] p-6 flex flex-col h-[350px]">
                    <h3
                        class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center justify-between">
                        <span class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-indigo-500"
                                :class="recentReports.length > 0 ? 'animate-pulse' : ''"></span>
                            User Reports
                        </span>
                        <span class="bg-indigo-500/20 text-indigo-400 px-2 py-0.5 rounded text-[8px]"
                            x-text="recentReports.length + ' REPORTS'"></span>
                    </h3>

                    <div class="flex-1 overflow-y-auto custom-scroll pr-2">
                        <template x-if="recentReports.length === 0">
                            <div class="h-full flex flex-col items-center justify-center opacity-30 text-center py-10">
                                <svg class="w-8 h-8 text-emerald-500 mb-2" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                                <p class="text-[10px] uppercase tracking-widest text-emerald-500 font-bold">
                                    System
                                    Monitoring:<br>No New Reports</p>
                            </div>
                        </template>

                        <!-- Individual Forensic Reports List -->
                        <div class="space-y-3 pb-4">
                            <template x-for="report in recentReports" :key="report.id">
                                <div
                                    class="p-4 rounded-xl bg-slate-800/20 border border-slate-700/30 hover:bg-slate-800/40 hover:border-indigo-500/20 transition-all cursor-pointer group flex flex-col">
                                    <div class="flex justify-between items-start mb-2">
                                        <span
                                            class="px-2 py-0.5 rounded text-[8px] font-bold uppercase tracking-widest flex items-center gap-1"
                                            :class="report.issue_type === 'Counterfeit Suspected' ? 'bg-rose-500/10 text-rose-400' : 'bg-amber-500/10 text-amber-400'">
                                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                                x-show="report.issue_type === 'Counterfeit Suspected'">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                                                </path>
                                            </svg>
                                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                                x-show="report.issue_type !== 'Counterfeit Suspected'">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                                                </path>
                                            </svg>
                                            <span x-text="report.issue_type"></span>
                                        </span>
                                        <span
                                            class="text-[8px] font-mono text-slate-500 bg-slate-900/50 px-1.5 py-0.5 rounded"
                                            x-text="new Date(report.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})"></span>
                                    </div>
                                    <div class="flex flex-col gap-0.5 text-left mb-2">
                                        <p class="text-[12px] font-bold text-indigo-100 group-hover:text-indigo-300 transition-colors truncate"
                                            x-text="report.medicine_name"></p>
                                        <p class="text-[9px] text-slate-400 font-mono"
                                            x-text="'BATCH: ' + report.batch_id">
                                        </p>
                                    </div>
                                    <div class="mt-auto p-2 bg-slate-900/50 rounded-lg border border-slate-700/30">
                                        <p class="text-[10px] text-slate-400 italic leading-relaxed"
                                            x-text="'&quot;' + report.description + '&quot;'"></p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </div>
    </main>

    <script>
        function analyticsDashboard() {
            return {
                stats: { total_scans: 0, scans_by_status: { fake: 0, genuine: 0, suspicious: 0 } },
                manufacturers: [],
                medicines: [],
                company: localStorage.getItem('medscan_company'),
                mfgStatus: '',
                selectedManufacturer: '',
                selectedMedicine: '',
                selectedStatus: '',
                outbreaks: [],
                recentReports: [],
                connected: false,
                seeding: false,
                map: null,
                charts: { dist: null },
                async init() {
                    if (this.company) {
                        try {
                            const res = await fetch(`http://127.0.0.1:8000/api/v1/manufacturer/status/${encodeURIComponent(this.company)}`);
                            if (res.ok) {
                                const data = await res.json();
                                this.mfgStatus = data.status;
                            }
                        } catch (e) { }
                    }
                    this.initMap();
                    this.initCharts();
                    this.fetchManufacturers();
                    this.fetchData();
                    setInterval(() => this.fetchData(), 5000);
                },
                async fetchManufacturers() {
                    try {
                        const res = await fetch('http://127.0.0.1:8000/api/v1/manufacturer/list');
                        this.manufacturers = await res.json();
                    } catch (e) {
                        console.error("Failed to load manufacturers list");
                    }
                },
                async onManufacturerChange() {
                    this.selectedMedicine = '';
                    if (this.selectedManufacturer) {
                        try {
                            const res = await fetch(`http://127.0.0.1:8000/api/v1/medicine/list?manufacturer=${encodeURIComponent(this.selectedManufacturer)}`);
                            this.medicines = await res.json();
                        } catch (e) {
                            console.error("Failed to load medicines list", e);
                            this.medicines = [];
                        }
                    } else {
                        this.medicines = [];
                    }
                    this.fetchData();
                },
                resetFilters() {
                    this.selectedManufacturer = '';
                    this.selectedMedicine = '';
                    this.selectedStatus = '';
                    this.medicines = [];
                    this.fetchData();
                },
                initMap() {
                    try {
                        this.map = L.map('map', { center: [20.5937, 78.9629], zoom: 5, zoomControl: false, attributionControl: false });
                        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(this.map);
                    } catch (e) { console.error("Map init failed:", e); }
                },
                initCharts() {
                    Chart.defaults.color = '#94a3b8';
                    const canvasDist = document.getElementById('distributionChart');

                    if (canvasDist) {
                        this.charts.dist = new Chart(canvasDist, {
                            type: 'doughnut',
                            data: {
                                labels: ['Genuine', 'Fake'],
                                datasets: [{
                                    data: [0, 0],
                                    backgroundColor: ['#10b981', '#f43f5e'],
                                    hoverOffset: 15,
                                    borderWidth: 0,
                                    borderRadius: 4,
                                    spacing: 5
                                }]
                            },
                            options: {
                                cutout: '85%',
                                maintainAspectRatio: false,
                                plugins: {
                                    legend: { display: false },
                                    tooltip: {
                                        backgroundColor: 'rgba(15, 23, 42, 0.9)',
                                        titleFont: { family: 'Outfit', size: 12 },
                                        bodyFont: { family: 'Outfit', size: 11 },
                                        padding: 12,
                                        cornerRadius: 8,
                                        displayColors: true
                                    }
                                },
                                animation: {
                                    animateRotate: true,
                                    animateScale: true,
                                    duration: 1000,
                                    easing: 'easeOutQuart'
                                }
                            }
                        });
                    }
                },
                async fetchData() {
                    try {
                        const baseUrl = 'http://127.0.0.1:8000/api/v1';

                        let queryParams = [];
                        if (this.selectedManufacturer) queryParams.push(`manufacturer=${encodeURIComponent(this.selectedManufacturer)}`);
                        if (this.selectedMedicine) queryParams.push(`medicine=${encodeURIComponent(this.selectedMedicine)}`);

                        const qString = queryParams.length > 0 ? `?${queryParams.join('&')}` : '';

                        const [stats, outbreaks, heatmap, reports] = await Promise.all([
                            fetch(`${baseUrl}/report/stats${qString}`).then(r => r.json()),
                            fetch(`${baseUrl}/analytics/outbreaks${qString}`).then(r => r.json()),
                            fetch(`${baseUrl}/analytics/heatmap${qString}`).then(r => r.json()),
                            fetch(`${baseUrl}/report/list${qString}`).then(r => r.json())
                        ]);
                        this.connected = true;
                        this.stats = stats;
                        this.outbreaks = outbreaks.data || [];
                        this.recentReports = reports || [];

                        // UI Updates (wrapped to prevent connection status flip)
                        try { this.updateMapPoints(heatmap.data || []); } catch (e) { console.error("Map UI error:", e); }
                        try { this.updateCharts(); } catch (e) { console.error("Chart UI error:", e); }
                    } catch (e) {
                        this.connected = false;
                        console.warn("⚠️ Telemetry Bridge Offline", e);
                    }
                },
                updateCharts() {
                    if (this.charts.dist && this.stats.scans_by_status) {
                        this.charts.dist.data.datasets[0].data = [
                            this.stats.scans_by_status.genuine || 0,
                            this.stats.scans_by_status.fake || 0
                        ];
                        this.charts.dist.update();
                    }
                },
                async seedData() {
                    this.seeding = true;
                    try {
                        const res = await fetch('http://127.0.0.1:8000/api/v1/analytics/seed-outbreaks', { method: 'POST' });
                        if (!res.ok) throw new Error("Seed failed");
                        alert("🚀 Forensic Telemetry Injected. Syncing global nodes...");
                        setTimeout(() => this.fetchData(), 500);
                    } catch (e) {
                        alert("⚠️ Demo Setup: Register a company & batch first, or ensure backend is UP.");
                    } finally {
                        setTimeout(() => this.seeding = false, 1500);
                    }
                },
                updateMapPoints(points) {
                    if (!this.map) return;
                    this.map.eachLayer((layer) => {
                        if (layer instanceof L.CircleMarker) this.map.removeLayer(layer);
                    });

                    if (points.length > 0) {
                        const markerCoords = points.filter(p => p.status.toUpperCase() !== 'SUSPICIOUS').map(p => [p.lat, p.lng]);
                        if (markerCoords.length > 0) {
                            const bounds = L.latLngBounds(markerCoords);
                            this.map.fitBounds(bounds, { padding: [50, 50], maxZoom: 8 });
                        }
                    }

                    points.forEach(p => {
                        const status = p.status || 'SUSPICIOUS';
                        const issueType = p.issue_type || status;

                        // DO NOT render SUSPICIOUS scans on the map as per user request
                        if (status.toUpperCase() === 'SUSPICIOUS') return;

                        let color = '';
                        if (status.toUpperCase().includes('FAKE') || status.toUpperCase().includes('COUNTERFEIT')) {
                            color = '#f43f5e'; // Red
                        } else if (status.toUpperCase().includes('GENUINE') || status.toUpperCase().includes('AUTHENTIC')) {
                            color = '#10b981'; // Green
                        } else {
                            return;
                        }

                        // Jitter to show individual dots better
                        const jitterLat = p.lat + (Math.random() - 0.5) * 0.12;
                        const jitterLng = p.lng + (Math.random() - 0.5) * 0.12;

                        const marker = L.circleMarker([jitterLat, jitterLng], {
                            radius: (status.toUpperCase().includes('FAKE')) ? 12 : 8,
                            fillColor: color,
                            color: color,
                            weight: 2,
                            fillOpacity: 0.8,
                            className: status.toUpperCase().includes('FAKE') ? 'threat-marker' : ''
                        }).addTo(this.map);

                        marker.bindTooltip(`
                            <div class="flex flex-col gap-1">
                                <span class="text-[10px] font-bold text-white uppercase">${p.medicine_name || 'Generic Asset'}</span>
                                <span class="text-[9px] font-black uppercase ${color === '#10b981' ? 'text-emerald-400' : 'text-rose-400'}">${status}</span>
                            </div>
                        `, { direction: 'top', sticky: true, opacity: 1 });
                    });
                }
            }
        }
    </script>
</body>

</html>
